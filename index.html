<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses</title>
<meta charset="utf-8">
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#ccd3e0; --navy:#21345a; --accent:#2f6fde;
          --warn:#b3261e; --chip:#e8edf7; --ok:#1e7a46; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --ink:#e7eaf1; --muted:#9aa3b5; --line:#2f3745; --navy:#8fb0ff; --accent:#7aa5ff;
            --warn:#ff8a80; --chip:#252c3a; --ok:#58b884; }
  }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 Roboto, -apple-system, "Segoe UI", sans-serif; }
  header { padding:14px 16px 6px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-size:20px; color:var(--navy); }
  .status { font-size:13px; color:var(--muted); margin-top:4px; }
  .status.bad { color:var(--warn); }
  main { padding:8px 16px 32px; max-width:560px; }
  .card { overflow:hidden; overflow-wrap:anywhere; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .count { float:right; font-size:13px; color:var(--muted); margin-left:8px; }
  .why { display:inline-block; font-size:13px; padding:3px 8px; border-radius:6px; background:var(--chip); color:var(--navy); }
  .why.need { color:var(--warn); }
  .amount { font-size:28px; font-weight:700; margin:10px 0 2px; }
  .when { color:var(--muted); font-size:14px; }
  .printed { color:var(--muted); font-size:13px; margin-top:3px; }
  .note { font-size:14px; margin-top:6px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  select, input[type=text], input[type=date], input[type=number] { width:100%; max-width:100%; font-family:inherit; font-size:16px; padding:10px;
          border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); }
  select.empty { border-color:var(--warn); }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:15px; }
  .check input { width:20px; height:20px; }
  .row2 { display:flex; gap:10px; margin-top:14px; }
  .row2 button { font-size:15px; padding:10px; font-weight:500; }
  .seg { display:flex; gap:6px; margin-top:6px; }
  .seg button { font-size:14px; padding:9px 4px; font-weight:500; }
  .seg button.on { background:var(--chip); border-color:var(--navy); color:var(--navy); font-weight:700; }
  .inv { margin-top:14px; padding:10px; border-radius:8px; background:var(--chip); font-size:14px; }
  .added { font-size:13px; color:var(--ok); margin-top:6px; }
  .buttons { display:flex; gap:10px; margin-top:16px; }
  button { flex:1; font-family:inherit; font-size:16px; font-weight:600; padding:13px; border-radius:10px; border:1px solid var(--line);
           background:var(--card); color:var(--ink); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.cashin { flex:none; padding:9px 14px; font-size:15px; background:var(--ok); border-color:var(--ok); color:#fff; }
  button:disabled { opacity:.5; }
  .hbtns { display:flex; flex-direction:column; gap:8px; flex:none; }
  button.runbtn { flex:none; padding:9px 14px; font-size:15px; background:var(--card); border-color:var(--navy); color:var(--navy); }
  .runline { margin:6px 16px 4px; max-width:528px; padding:10px 12px; border-radius:10px; background:var(--chip); color:var(--navy); font-size:14px; }
  .runline.bad { color:var(--warn); }
  .runline.ok { color:var(--ok); }
  .list .li { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; }
  .list .li div { flex:1; min-width:0; }
  .list small { color:var(--muted); display:block; }
  .list button { flex:none; font-size:13px; padding:7px 10px; }
  .empty { text-align:center; color:var(--muted); padding:28px 0; }
  .viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:10; overflow:auto; -webkit-overflow-scrolling:touch; }
  .viewer .bar { position:sticky; top:0; display:flex; justify-content:flex-end; padding:10px; }
  .viewer .bar button { flex:none; padding:8px 14px; }
  .viewer img { display:block; width:100%; height:auto; }
  .viewer .mail { background:var(--card); color:var(--ink); margin:0 10px 20px; border-radius:10px; padding:14px; font-size:14px; }
  .viewer pre { white-space:pre-wrap; overflow-wrap:anywhere; font-family:inherit; margin:8px 0 0; }
  .viewer .msg { color:#fff; padding:20px; }
  .part { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .part input, .part select { flex:1; min-width:0; }
  .part button { flex:none; padding:8px 12px; font-size:14px; }
  .left { font-size:13px; color:var(--muted); margin-top:6px; }
  .left.bad { color:var(--warn); }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:20;
           background:var(--navy); color:var(--card); padding:10px 18px; border-radius:20px; font-weight:600; font-size:15px; }
</style>
</head>
<body>
<header>
  <div><h1>Expenses</h1><div id="status" class="status">Loading…</div></div>
  <div class="hbtns"><button class="cashin" onclick="cashForm()">+ CASH IN</button>
    <button class="runbtn" id="runbtn" onclick="runNow()">▶ RUN NOW</button></div>
</header>
<div id="runline" class="runline" hidden></div>
<main id="main"></main>
<div id="viewer" class="viewer" hidden></div>
<input type="file" id="picker" accept="image/*,application/pdf" hidden>
<div id="toast" class="toast" hidden></div>
<script>
// GitHub Pages copy of the app (Jay 15 Nov 2026: phones signed into several Google accounts cannot open
// script.google.com pages). Same page; its google.script.run calls go to the script's JSON API instead.
var EXEC = 'https://script.google.com/macros/s/AKfycbwLz9b6ZYBZy8S0_GY7fM2zKN73b3jtfSmOe6sOLeBM9wpjmL2ezSm-jwVGCM7QmAUV/exec';
window.google = {script: {run: (function () {
  function R(s, f) { this.s = s; this.f = f; }
  R.prototype.withSuccessHandler = function (s) { return new R(s, this.f); };
  R.prototype.withFailureHandler = function (f) { return new R(this.s, f); };
  ['getData', 'getMedia', 'answer', 'skipItem', 'uploadFile', 'laterAnswer', 'closeLater', 'cashIn'].forEach(function (n) {
    R.prototype[n] = function () {
      var s = this.s, f = this.f, args = [].slice.call(arguments);
      fetch(EXEC, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: n, args: args})})
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j.error) { if (f) f({message: j.error}); } else if (s) s(j.ok); })
        .catch(function (e) { if (f) f({message: 'No connection to Google: ' + e.message}); });
    };
  });
  return new R();
})()}};
</script>
<script>
var data = null, i = 0, K = (function () { var m = location.hash.match(/k=([^&]+)/); if (m) { try { localStorage.setItem('k', m[1]); } catch (e) {} return m[1]; } try { return localStorage.getItem('k') || ''; } catch (e) { return ''; } })();
function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id) { return document.getElementById(id); }
function toast(s) { var t = $('toast'); t.textContent = s; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2200); }
function busy(on) { document.querySelectorAll('main button').forEach(function (b) { b.disabled = on; }); }
function call(fn, args, ok) {
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { busy(false); alert(e.message); });
  r[fn].apply(r, [K].concat(args));
}

function load() {
  google.script.run.withSuccessHandler(function (d) { data = d; i = 0; showStatus(); show(); })
    .withFailureHandler(function (e) { $('main').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; })
    .getData(K);
}

// ---------- Run now (Jay 21 Nov 2026: say what is happening, so he never has to wonder) ----------
var runTimer = null, runAsked = false, runWasBusy = false;
function dmy(s) {  // dd/MM/yyyy HH:mm (Bangkok)
  var m = /^(\d\d)\/(\d\d)\/(\d{4}) (\d\d):(\d\d)/.exec(s || '');
  return m ? new Date(m[3] + '-' + m[2] + '-' + m[1] + 'T' + m[4] + ':' + m[5] + ':00+07:00') : null;
}
function hm(s) { var d = dmy(s); if (!d) return ''; var t = (s || '').slice(11, 16), today = (new Date()).toDateString() === d.toDateString(); return today ? t : s.slice(0, 5) + ' ' + t; }
function runState(r) {
  var now = new Date(), req = r.REQUESTED || '', waiting = !!req && req !== (r.TAKEN || ''), seen = dmy(r['PC SEEN']);
  var started = dmy(r.STARTED), running = r.STATE === 'RUNNING' && started && now - started < 3600000;
  var exp = r['SIGN-IN EXPIRES'] ? new Date(r['SIGN-IN EXPIRES'] + ':00+07:00') : null;
  var wrote = r['STATUS WRITTEN'] ? new Date(r['STATUS WRITTEN'] + ':00+07:00') : null;
  var signedOut = exp && now > exp && (!wrote || wrote < exp) && (!seen || seen < exp);
  var pcOff = !running && (!seen || now - seen > 6 * 60000);
  if (signedOut) return {t: 'The PC\'s Google sign-in has ended, so no run can start. On the PC run: python -m importer.auth', c: 'bad', busy: false};
  if (running) return {t: r.KIND === 'quick' ? 'Running since ' + hm(r.STARTED) + ' (about 6 min). What it finds will show here.'
                                             : 'A run is in progress (started ' + hm(r.STARTED) + '), please wait.' + (waiting ? ' Yours starts right after it.' : ''),
                       c: '', busy: true};
  if (waiting) return pcOff ? {t: 'Your PC is not reachable at the moment' + (seen ? ' (last seen ' + hm(r['PC SEEN']) + ')' : '') + '. The run will start as soon as it is on again.', c: 'bad', busy: true}
                            : {t: 'Requested at ' + hm(req) + '. Starting within a minute…', c: '', busy: true};
  var ended = dmy(r.ENDED);
  if (r.STATE === 'DONE' && ended && (runAsked || now - ended < 12 * 3600000))
    return {t: (r.KIND === 'quick' ? 'Run finished ' : 'Last run finished ') + hm(r.ENDED) + (r.OK === 'NO' ? ' with failures' : '') + '. ' + (r.RESULT || ''),
            c: r.OK === 'NO' ? 'bad' : 'ok', busy: false};
  return null;
}
function showRun(r) {
  if (!r) return;
  var s = runState(r), el = $('runline');
  el.hidden = !s;
  if (s) { el.textContent = s.t; el.className = 'runline' + (s.c ? ' ' + s.c : ''); }
  if (s && s.busy) { runWasBusy = true; if (!runTimer) runTimer = setInterval(pollRun, 15000); }
  else {
    if (runTimer) { clearInterval(runTimer); runTimer = null; }
    if (runWasBusy) { runWasBusy = false; reloadAfterRun(); }  // new lines to look at may have come
  }
  return s;
}
function pollRun() { call('getRun', [], function (r) { if (data) data.run = r; showRun(r); }); }
function reloadAfterRun() {
  google.script.run.withSuccessHandler(function (d) { data = d; i = 0; showStatus(); show(); }).getData(K);
}
function runNow() {
  var r = data && data.run, s = r && runState(r);
  if (s && s.busy && r.STATE === 'RUNNING' && r.KIND === 'quick') { toast('A run is in progress, please wait'); return; }
  if (s && s.busy && r.REQUESTED && r.REQUESTED !== (r.TAKEN || '')) { toast('Already requested at ' + hm(r.REQUESTED)); return; }
  $('runbtn').disabled = true;
  runAsked = true;
  call('runNow', [], function (r2) { $('runbtn').disabled = false; data.run = r2; var s2 = showRun(r2); toast(s2 && s2.c === 'bad' ? 'Requested, but see the message' : 'Run requested'); });
}

function showStatus() {
  var s = data.status, el = $('status'), bits = [], bad = false;
  if (s['LAST RUN END']) bits.push('Last run ' + s['LAST RUN END'].replace(/^\d{4}-(\d\d)-(\d\d)[T ]/, '$2/$1 ') + (s['LAST RUN OK'] === 'NO' ? ' (with failures)' : ''));
  if (s['LAST RUN OK'] === 'NO') bad = true;
  // Jay 21 Nov 2026 (Google project in Production): no countdown; a line only when no run got through after the
  // 7-day mark, i.e. the sign-in really ended
  if (s['SIGN-IN EXPIRES'] && s['STATUS WRITTEN']) {
    var exp = new Date(s['SIGN-IN EXPIRES'] + ':00+07:00'), wrote = new Date(s['STATUS WRITTEN'] + ':00+07:00');
    if (new Date() - exp > 16 * 3600000 && wrote < exp) { bits.push('Google sign-in ended: on the PC run python -m importer.auth'); bad = true; }
  }
  el.textContent = bits.join(' · ');
  el.className = 'status' + (bad ? ' bad' : '');
  showRun(data.run);
}

// ---------- the list ----------
function show() {
  var m = $('main'), h = laterCard();
  if (!data.items.length || i >= data.items.length) {
    m.innerHTML = h + '<div class="card empty">Nothing to look at.' +
      (data.items.length ? '<br><br><button onclick="skipped=0;i=0;show()">Show the skipped ones again</button>' : '') + '</div>';
    return;
  }
  var x = data.items[i], noAcc = !x.ACCOUNT;
  x._files = x._files || 0;
  var opts = (noAcc ? '<option value="">choose…</option>' : '') + data.accounts.concat(
      x.ACCOUNT && data.accounts.indexOf(x.ACCOUNT) < 0 ? [x.ACCOUNT] : []).map(function (a) {
    return '<option' + (a === x.ACCOUNT ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('');
  var src = x['SLIP FILE'] ? 'See slip' : x.EMAIL ? 'See email' : '';
  m.innerHTML = h +
    '<div class="card">' +
    '<span class="why' + (noAcc ? ' need' : '') + '">' + esc(x.WHY) + '</span><span class="count">' + (i + 1) + ' of ' + data.items.length + '</span>' +
    '<div class="amount">' + (x.AMOUNT ? esc(x.AMOUNT) : '—') + ' THB</div>' +  // always there, even before the amount is known
    '<div class="when">' + esc(x.DATE) + (x.TIME ? ' · ' + esc(x.TIME) : '') + ' · ' + esc(x.BANK) + '</div>' +
    (x.NOTE ? '<div class="note">Note: ' + esc(x.NOTE) + '</div>' : '') +
    '<div id="split">' + splitHtml(x) + '</div>' +
    '<label>Payee</label><input type="text" id="aka" value="' + esc(x.AKA || x.PAYEE) + '">' +
    ((x.AKA || x.PAYEE) !== x.PAYEE ? '<div class="printed">As printed: ' + esc(x.PAYEE) + '</div>' : '') +
    '<label>Account</label><select id="account"' + (noAcc ? ' class="empty"' : '') + '>' + opts + '</select>' +
    (x.RULE ? '<div class="printed">Rule already set: always ' + esc(x.RULE) + ' for this payee</div><input type="checkbox" id="always" hidden>'
            : '<div class="check"><input type="checkbox" id="always"><span>Make it the rule for this payee (no rule yet)</span></div>') +
    '<label>What it was for (optional)</label><input type="text" id="description" autocapitalize="characters" style="text-transform:uppercase">' +
    (x.INVOICE === 'YES' ? '<div class="inv"><b>Invoice</b><div class="seg" id="inv">' +
      '<button data-v="NOW" onclick="invoice(this)">Attach now</button>' +
      '<button data-v="LATER" onclick="invoice(this)">Coming later</button>' +
      '<button data-v="NONE" onclick="invoice(this)">No invoice</button></div></div>' : '') +
    '<div class="row2">' + (src ? '<button onclick="see()">' + src + '</button>' : '') +
      '<button onclick="addFile(\'' + esc(x.KEY) + '\')">Add file</button></div>' +
    '<div class="added" id="added">' + (x._files ? x._files + ' file(s) added ✓' : '') + '</div>' +
    '<div class="buttons"><button onclick="skip()">Skip</button><button class="primary" onclick="ok()">OK</button></div>' +
    '</div>';
}

function invoice(b) {
  [].forEach.call(b.parentNode.children, function (e) { e.classList.remove('on'); });
  b.classList.add('on');
  if (b.getAttribute('data-v') === 'NOW') addFile(data.items[i].KEY);
}

// Skip: nothing saved, the card goes to the end (here at once, and in the sheet for next time)
var skipped = 0;
function skip() {
  var x = data.items.splice(i, 1)[0];
  data.items.push(x);
  skipped++;
  google.script.run.withFailureHandler(function () {}).skipItem(K, x.KEY);
  window.scrollTo(0, 0);
  if (skipped >= data.items.length) {
    $('main').innerHTML = laterCard() + '<div class="card empty">You skipped all ' + data.items.length + '. They stay here for later.' +
      '<br><br><button onclick="skipped=0;i=0;show()">Show them again</button></div>';
    return;
  }
  show();
}

// ---------- split (Jay 18 Nov 2026): one payment, 2 or more amounts (an invoice and a delivery fee) ----------
function num(s) { return Number(String(s || '').replace(/[, ]/g, '')) || 0; }
function splitHtml(x) {
  var parts = x._parts || (x.SPLIT ? x.SPLIT.split('|').map(function (p) { return p.trim(); }) : null);
  if (!parts) return '<div class="row2"><button onclick="splitOpen()">Split the amount</button></div>';
  return '<label>Split into</label>' + parts.map(function (p, n) {
    return '<div class="part"><input type="text" inputmode="decimal" class="sp" value="' + esc(p) + '" oninput="splitLeft()">' +
      (parts.length > 2 ? '<button onclick="splitDrop(' + n + ')">✕</button>' : '') + '</div>'; }).join('') +
    '<div class="left" id="sp_left"></div>' +
    '<div class="row2"><button onclick="splitAdd()">+ Part</button><button onclick="splitNone()">Not split</button></div>';
}
function splitVals() { return [].map.call(document.querySelectorAll('.sp'), function (e) { return e.value; }); }
function splitRedraw() { $('split').innerHTML = splitHtml(data.items[i]); splitLeft(); }
function splitOpen() { var x = data.items[i]; x._parts = [x.AMOUNT, '']; splitRedraw(); }
function splitAdd() { var x = data.items[i]; x._parts = splitVals().concat(['']); splitRedraw(); }
function splitDrop(n) { var x = data.items[i]; x._parts = splitVals(); x._parts.splice(n, 1); splitRedraw(); }
function splitNone() { var x = data.items[i]; x._parts = null; x.SPLIT = ''; x._unsplit = true; splitRedraw(); }
function splitLeft() {
  var el = $('sp_left'); if (!el) return;
  var x = data.items[i], d = num(x.AMOUNT) - splitVals().reduce(function (t, v) { return t + num(v); }, 0);
  el.textContent = Math.abs(d) < 0.005 ? 'Adds up ✓' : (d > 0 ? d.toFixed(2) + ' left to split' : (-d).toFixed(2) + ' too much');
  el.className = 'left' + (Math.abs(d) < 0.005 ? '' : ' bad');
}

// OK: what changed on the card is saved; nothing changed = seen
function ok() {
  var x = data.items[i], acc = $('account').value, aka = $('aka').value.trim(), on = document.querySelector('#inv .on');
  var a = {account: acc && acc !== x.ACCOUNT ? acc : '', aka: aka && aka !== (x.AKA || x.PAYEE) ? aka : '',
           always: $('always').checked, description: $('description').value.trim().toUpperCase(), invoice: on ? on.getAttribute('data-v') : ''};
  if (!acc) { alert('Pick the account first (or Skip).'); return; }
  if (a.always && !a.account) a.account = acc;
  if (a.invoice === 'NOW' && !x._files) { alert('Add the invoice file first, or pick Coming later.'); return; }
  if (document.querySelector('.sp')) {
    var parts = splitVals().map(num).filter(function (v) { return v > 0; });
    var sum = parts.reduce(function (t, v) { return t + v; }, 0);
    if (parts.length < 2 || Math.abs(sum - num(x.AMOUNT)) > 0.005) { alert('The parts must add up to ' + x.AMOUNT + ' (or tap Not split).'); return; }
    a.split = parts;
  } else if (x._unsplit) a.split = [num(x.AMOUNT)];
  busy(true);
  call('answer', [x.KEY, a], function () {
    busy(false); data.items.splice(i, 1); skipped = 0; show(); window.scrollTo(0, 0);
    toast(a.invoice === 'LATER' ? 'OK ✓ invoice on the Saturday list' : 'OK ✓');
  });
}

// ---------- files ----------
var pickFor = null;
function addFile(key) { pickFor = key; $('picker').value = ''; $('picker').click(); }
$('picker').addEventListener('change', function () {
  var f = this.files[0];
  if (!f || !pickFor) return;
  var key = pickFor, cb = pickFor === '__cash__' ? cashFile : null;
  readFile(f, function (b) {
    if (cb) return cb(b);
    busy(true); toast('Uploading…');
    call('uploadFile', [key, b.name, b.mime, b.b64], function () {
      busy(false);
      var x = data.items.filter(function (y) { return y.KEY === key; })[0] || data.later.filter(function (y) { return y.KEY === key; })[0];
      if (x) x._files = (x._files || 0) + 1;
      if (later[key]) { later[key](); return; }
      if ($('added')) $('added').textContent = x._files + ' file(s) added ✓';
      toast('File added ✓');
    });
  });
});

// photos are made smaller on the phone first (faster to send); PDFs go as they are
function readFile(f, done) {
  var r = new FileReader();
  if (f.type.indexOf('image/') === 0 && !/gif|svg/.test(f.type)) {
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 2200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        done({name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', 0.85).split(',')[1]});
      };
      img.src = r.result;
    };
  } else {
    r.onload = function () { done({name: f.name, mime: f.type || 'application/octet-stream', b64: r.result.split(',')[1]}); };
  }
  r.readAsDataURL(f);
}

// See slip / See email: full screen, closed with ✕
function see() {
  var x = data.items[i], v = $('viewer');
  v.innerHTML = '<div class="bar"><button onclick="$(\'viewer\').hidden=true">✕ Close</button></div><div class="msg">Loading…</div>';
  v.hidden = false;
  google.script.run.withSuccessHandler(function (r) {
    var h = '<div class="bar"><button onclick="$(\'viewer\').hidden=true">✕ Close</button></div>';
    if (r.image) h += '<img src="' + r.image + '">';
    if (r.email) h += '<div class="mail"><b>' + esc(r.email.subject) + '</b><br>' + esc(r.email.from) + ' · ' + esc(r.email.date) + '<pre>' + esc(r.email.body) + '</pre></div>';
    if (!r.image && !r.email) h += '<div class="msg">' + esc(r.error || 'Nothing to show') + '</div>';
    v.innerHTML = h;
  }).withFailureHandler(function (e) { v.querySelector('.msg').textContent = e.message; }).getMedia(K, x['SLIP FILE'], x['SLIP FILE'] ? '' : x.EMAIL);
}

// ---------- the Saturday list: invoices put off with "Coming later" ----------
var later = {};
function laterCard() {
  if (!data.later || !data.later.length) return '';
  return '<div class="card"><span class="why">Saturday · ' + data.later.length + ' invoice(s) you said would come later</span>' +
    '<div class="list">' + data.later.map(function (x) {
      return '<div class="li"><div>' + esc(x.AKA || x.PAYEE) + '<small>' + esc(x.DATE.slice(0, 5)) + ' · ' + esc(x.BANK) + ' · ' + esc(x.AMOUNT || '—') +
        ' · ' + esc(x.ACCOUNT) + '</small></div><button onclick="laterAttach(\'' + esc(x.KEY) + '\')">Attach</button>' +
        '<button onclick="laterNone(\'' + esc(x.KEY) + '\')">None</button></div>';
    }).join('') + '</div><div class="buttons"><button onclick="closeLater()">Close until next Saturday</button></div></div>';
}
function dropLater(key) { data.later = data.later.filter(function (y) { return y.KEY !== key; }); show(); }
function laterAttach(key) {
  later[key] = function () { delete later[key]; call('laterAnswer', [key, 'NOW'], function () { busy(false); dropLater(key); toast('Invoice added ✓'); }); };
  addFile(key);
}
function laterNone(key) { busy(true); call('laterAnswer', [key, 'NONE'], function () { busy(false); dropLater(key); toast('No invoice ✓'); }); }
function closeLater() { busy(true); call('closeLater', [], function () { busy(false); data.later = []; show(); }); }

// ---------- CASH IN ----------
var cash = null;
function cashForm() {
  if (!data) return;
  cash = {how: 'CASH', file: null};
  var today = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10).split('-').reverse().join('/');  // dd/mm/yyyy (Jay 18 Nov 2026: never the US format)
  var opt = function (l) { return '<option value="">choose…</option>' + l.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join(''); };
  window.scrollTo(0, 0);
  $('main').innerHTML = '<div class="card"><b>Cash in</b>' +
    '<label>Date</label><div class="part"><input type="text" id="c_date" inputmode="numeric" placeholder="dd/mm/yyyy" value="' + today + '">' +
      '<button onclick="cashCal()" aria-label="Calendar">📅</button></div>' +
    '<input type="date" id="c_cal" style="position:absolute;opacity:0;width:1px;height:1px" onchange="cashCalPicked(this)">' +

    '<label>Received how</label><div class="seg" id="c_how">' +
      '<button data-v="CASH" class="on" onclick="cashHow(this)">Cash in hand</button>' +
      '<button data-v="SCB" onclick="cashHow(this)">Into SCB</button><button data-v="BBL" onclick="cashHow(this)">Into BBL</button></div>' +
    '<label>From</label><select id="c_origin">' + opt(data.cashIn.origins) + '</select>' +
    '<label>Amount (THB) and For</label><div id="c_parts"></div>' +
    '<div class="left" id="c_total"></div>' +
    '<div class="row2"><button onclick="cashPart()">+ Split: another amount</button></div>' +
    '<label>Note (optional)</label><input type="text" id="c_note">' +
    '<div class="row2"><button onclick="pickFor=\'__cash__\';$(\'picker\').value=\'\';$(\'picker\').click()">Add slip / photo</button></div>' +
    '<div class="added" id="c_added"></div>' +
    '<div class="buttons"><button onclick="show()">Cancel</button><button class="primary" onclick="cashSave()">Save</button></div></div>';
  cashPart([{amount: '', account: ''}]);
}
function cashParts() {
  return [].map.call(document.querySelectorAll('#c_parts .part'), function (e) {
    return {amount: e.querySelector('input').value, account: e.querySelector('select').value}; });
}
function cashPart(keep) {
  var have = keep || cashParts(), opt = '<option value="">For…</option>' + data.cashIn.accounts.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join('');
  if (!keep) have.push({amount: '', account: ''});
  $('c_parts').innerHTML = have.map(function (p, n) {
    return '<div class="part"><input type="text" inputmode="decimal" placeholder="0.00" value="' + esc(p.amount) + '" oninput="cashTotal()">' +
      '<select>' + opt.replace('<option>' + esc(p.account) + '</option>', '<option selected>' + esc(p.account) + '</option>') + '</select>' +
      (have.length > 1 ? '<button onclick="cashDrop(' + n + ')">✕</button>' : '') + '</div>'; }).join('');
  cashTotal();
}
function cashDrop(n) { var p = cashParts(); p.splice(n, 1); cashPart(p); }
function cashTotal() {
  var p = cashParts(), t = p.reduce(function (s, x) { return s + num(x.amount); }, 0);
  $('c_total').textContent = p.length > 1 ? 'Total ' + t.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' THB, ' + p.length + ' parts' : '';
}
// the phone's calendar (its pop-up follows the phone's language); the field always shows dd/mm/yyyy
function cashCal() {
  var c = $('c_cal'), m = $('c_date').value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) c.value = m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  try { c.showPicker(); } catch (e) { c.focus(); c.click(); }
}
function cashCalPicked(c) { if (c.value) $('c_date').value = c.value.split('-').reverse().join('/'); }
function cashHow(b) { [].forEach.call(b.parentNode.children, function (e) { e.classList.remove('on'); }); b.classList.add('on'); cash.how = b.getAttribute('data-v'); }
function cashFile(b) { cash.file = b; $('c_added').textContent = 'Photo added ✓'; }
function cashSave() {
  var m = $('c_date').value.trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);
  var iso = m ? (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) : '';
  if (!m || Number(m[2]) > 12 || Number(m[1]) > 31) { alert('Date as dd/mm/yyyy, e.g. 17/11/2026.'); return; }
  var c = {date: iso, parts: cashParts(), how: cash.how, origin: $('c_origin').value,
           note: $('c_note').value.trim(), file: cash.file};
  if (!c.date || !c.origin || c.parts.some(function (p) { return !(num(p.amount) > 0) || !p.account; })) {
    alert('Date, From, and an amount and For on every line are needed.'); return; }
  busy(true); toast('Saving…');
  call('cashIn', [c], function () { busy(false); show(); toast('Cash in saved ✓'); });
}
load();
</script>
